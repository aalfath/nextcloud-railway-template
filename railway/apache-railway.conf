# Health check for Railway: 200 only when Nextcloud is installed, not in
# maintenance mode, and PostgreSQL answers. It lives outside the docroot, so it
# needs no trusted domain and adds no file to Nextcloud's integrity check.
Alias /healthz /opt/railway/healthz/index.php
<Directory /opt/railway/healthz>
    Require all granted
</Directory>

# Railway serves the site over HTTPS only. No includeSubDomains, so a custom
# domain's other subdomains are not affected.
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=15552000"
</IfModule>
